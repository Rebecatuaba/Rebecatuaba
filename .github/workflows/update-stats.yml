name: Atualizar cards do GitHub

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate metrics/stats cards
        uses: anuraghazra/github-readme-stats@master
        with:
          username: Rebecatuaba
          show_icons: true
          theme: midnight-purple
          token: ${{ secrets.GITHUB_TOKEN }}
